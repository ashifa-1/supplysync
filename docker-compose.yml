services:
  postgres:
    image: postgres:15-alpine
    container_name: supplysync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: supplysync_db
      POSTGRES_USER: supplysync_user
      POSTGRES_PASSWORD: supplysync_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: supplysync_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

